[build-system]
build-backend = "flit_core.buildapi"
requires = ["flit_core"]

[project]
name = 'not-dot-net'
version = "0.1.0"
description = "A simple Intranet for LPP."
keywords = ["intranet", "plasma-physics", "cnrs", "lpp"]
authors = [
    { name = "Alexis Jeandet", email = "alexis.jeandet@member.fsf.org" }
]

maintainers = [
    { name = "Alexis Jeandet", email = "alexis.jeandet@member.fsf.org" }
]

requires-python = ">=3.12"
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
# Floors are the versions the suite was last verified against.
# Ceilings stop an untested major (Pillow 14, APScheduler 4, NiceGUI 4, ...)
# from arriving via `uv lock --upgrade` or a lock-less install. Raising a
# ceiling is a deliberate act: bump it, re-lock, run the suite.
dependencies = [
    "nicegui>=3.18.0,<4",
    "cyclopts>=5.3.2,<6",
    "sqlalchemy>=2.0.55,<2.1",
    "databases[sqlite]>=0.9.0,<1",
    "ldap3>=2.9.1,<3",
    "dnspython>=2.9.0,<3",
    "pydantic>=2.14.1,<3",
    "fastapi-users[sqlalchemy]>=15.0.5,<16",
    "aiosqlite>=0.22.1,<1",
    "asyncpg>=0.32.0,<1",
    "passlib>=1.7.4,<2",
    "aiosmtplib>=5.1.3,<6",
    "pyyaml>=6.0.3,<7",
    "alembic>=1.20.1,<2",
    "cryptography>=50.0.2,<51",
    "phonenumbers>=9.0.42,<10",
    "apscheduler>=3.11.3,<4",
    "pillow>=13.0.0,<14",
    "impacket>=0.13.1,<1",
]


[project.optional-dependencies]
test = [
    "pytest>=9.1.1,<10",
    "pytest-asyncio>=1.4.1,<2",
    "aiosqlite>=0.22.1,<1",
]

[project.scripts]
not-dot-net = "not_dot_net.cli:app"

[project.urls]
homepage = "https://github.com/jeandet/not-dot-net"


[tool.ruff.lint]
select = ["NPY201"]

[tool.pytest]
asyncio_mode = "auto"
main_file = "not_dot_net/app.py"
addopts = ["-p", "nicegui.testing.user_plugin"]
